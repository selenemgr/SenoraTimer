<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senora Grand</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #131c33;
    --line: #26324f;
    --green: #22e06b;
    --green-dark: #138a40;
    --white: #f4f7f4;
    --muted: #8a9a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--white);
    font-family: "Segoe UI", system-ui, sans-serif; min-height: 100vh;
  }
  header {
    padding: 22px 16px 14px; text-align: center;
    border-bottom: 3px solid var(--green);
    background: #0f1730;
  }
  header h1 {
    margin: 0; font-size: clamp(1.8rem, 6vw, 3rem); letter-spacing: .15em;
    text-transform: uppercase; font-style: italic; font-weight: 900;
  }
  header h1 span { color: var(--green); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .85rem; letter-spacing: .2em; text-transform: uppercase; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
    padding: 16px;
  }
  .controls label { color: var(--muted); font-size: .9rem; }
  input[type=number] {
    width: 80px; padding: 9px; background: #0f1730; color: var(--white);
    border: 1px solid var(--line); border-radius: 6px; font-size: 1rem; text-align: center;
  }
  button {
    cursor: pointer; border: 1px solid var(--green); background: transparent; color: var(--green);
    padding: 10px 18px; border-radius: 6px; font-weight: 700; font-size: .95rem;
    text-transform: uppercase; letter-spacing: .06em; transition: .15s;
  }
  button:hover:not(:disabled) { background: var(--green); color: #000; }
  button.primary { background: var(--green); color: #000; }
  button.primary:hover:not(:disabled) { background: var(--white); border-color: var(--white); }
  button.white { border-color: var(--white); color: var(--white); }
  button.white:hover:not(:disabled) { background: var(--white); color: #000; }
  button:disabled { opacity: .3; cursor: not-allowed; }
  .grid {
    display: grid; gap: 14px; padding: 8px 16px 40px; max-width: 1300px; margin: 0 auto;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--green));
    border-radius: 8px; padding: 14px; position: relative;
  }
  .card.done { border-left-color: var(--white); }
  .card .top { display: flex; gap: 8px; align-items: center; }
  .card .num {
    background: var(--c, var(--green)); color: #000; font-weight: 900; border-radius: 4px;
    padding: 2px 8px; font-size: .9rem;
  }
  .card input.name {
    flex: 1; min-width: 0; background: transparent; border: none; border-bottom: 1px dashed var(--line);
    color: var(--white); font-size: 1.05rem; font-weight: 700; padding: 3px;
  }
  .card .pos {
    background: var(--white); color: #000; font-weight: 900; padding: 2px 8px; border-radius: 4px; display: none;
  }
  .card.done .pos { display: block; }
  .time {
    font-family: Consolas, "Courier New", monospace; font-size: 2.3rem; font-weight: 700;
    color: var(--c, var(--green)); margin: 10px 0 4px; text-align: center; letter-spacing: .03em;
  }
  .card.done .time { color: var(--white); }
  .stats { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
  .stats b { color: var(--white); font-family: Consolas, monospace; }
  .btns { display: flex; gap: 8px; }
  .btns button { flex: 1; padding: 12px 6px; }
  .laps {
    list-style: none; margin: 10px 0 0; padding: 0;    font-family: Consolas, monospace; font-size: .85rem;
  }
  .laps li { display: flex; justify-content: space-between; padding: 3px 4px; border-top: 1px solid var(--line); color: var(--muted); }
  .laps li.best { color: var(--c, var(--green)); font-weight: 700; }
  .btns2 { display: flex; gap: 8px; margin-top: 8px; }
  .btns2 > button, .btns2 .tm > button { width: 100%; padding: 8px 6px; font-size: .8rem; }
  .btns2 > button, .btns2 .tm { flex: 1; }
  .tm { position: relative; }

  .tpop {
    display: none; position: absolute; left: -8px; bottom: calc(100% + 22px); width: min(380px, 88vw); padding: 18px 20px; z-index: 20;
    background: #0f1730; border: 2px solid var(--c, var(--green)); border-radius: 12px; box-shadow: 0 10px 34px #000;
    font-family: Consolas, monospace; font-size: 1.05rem; text-align: left;
  }
  .tpop::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 26px; }
  .tpop.flip { left: auto; right: -8px; }
  .tm.open .tpop { display: block; }
  .tphead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .tphead h4 { margin: 0 !important; }
  .tpop .cerrar { width: 30px; height: 30px; padding: 0; line-height: 1; font-size: 1.1rem; border-color: var(--white); color: var(--white); border-radius: 50%; }
  .tpop h4 { margin: 0 0 12px; font: 700 .9rem "Segoe UI", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--c, var(--green)); }
  .tpop ol { margin: 0; padding: 0; list-style: none; max-height: 300px; overflow-y: auto; }
  .tpop li { display: flex; justify-content: space-between; padding: 8px 4px; border-top: 1px solid var(--line); color: var(--muted); }
  .tpop li.best { color: var(--c, var(--green)); font-weight: 700; }
  .tpop li.tot { color: var(--white); font-weight: 700; }
  .penbadge { text-align: center; font-size: .8rem; font-weight: 700; color: #ff0000; min-height: 1em; margin-bottom: 6px; }
  .tpop li.pen { color: #ff0000; font-weight: 700; }
  button.penal { border-color: #ff0000; color: #ff0000; }
  button.penal:hover:not(:disabled) { background: #ff0000; color: #fff; }
  .card.open { z-index: 30; }
  html, body { overflow-x: hidden; }
  .cp { position: relative; }
  .cp .cur { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid var(--white); background: var(--c, var(--green)); }
  .cp .cur:hover:not(:disabled) { background: var(--c, var(--green)); transform: scale(1.12); }
  .pop {
    display: none; position: absolute; right: 0; top: 36px; width: 196px; padding: 10px;
    background: #0f1730; border: 1px solid var(--green); border-radius: 8px; box-shadow: 0 6px 20px #000;
  }
  .cp.open .pop { display: block; }
  .sw { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .sw button { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .sw button:hover:not(:disabled) { border-color: var(--white); transform: scale(1.15); }
  .sw button.sel { border-color: var(--white); }
  .hexrow { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  .hexrow .pen { padding: 3px 8px; font-size: 1rem; text-transform: none; }
  .hexrow input.hex {
    display: none; flex: 1; min-width: 0; width: 100%; padding: 5px; background: #0b1120; color: var(--white);
    border: 1px solid var(--line); border-radius: 4px; font-family: Consolas, monospace; font-size: .9rem; text-transform: uppercase;
  }
  .hexrow input.hex.bad { border-color: #fff; outline: 1px solid #fff; }
  .cp.edit .hexrow input.hex { display: block; }
  .hexrow label { font-size: .75rem; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; grid-column: 1 / -1; }

  @media (max-width: 600px) {
    header { padding: 6px 8px; border-bottom-width: 2px; }
    header h1 { font-size: 1.2rem; }
    header p { display: none; }
    .controls { flex-wrap: nowrap; gap: 6px; padding: 6px 8px; }
    .controls label { display: none; }
    input[type=number] { width: 48px; padding: 5px; font-size: .85rem; }
    .controls button { padding: 6px 8px; font-size: .7rem; letter-spacing: 0; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 4px 6px 10px; }
    .card { padding: 6px; border-left-width: 3px; min-width: 0; }
    .card input.name { width: 0; }
    .controls button { flex: 1 1 auto; min-width: 0; white-space: nowrap; }
    .card .top { gap: 4px; }
    .card .num { padding: 1px 5px; font-size: .75rem; }
    .card input.name { font-size: .8rem; padding: 1px; }
    .card .pos { padding: 1px 5px; font-size: .75rem; }
    .cp .cur { width: 20px; height: 20px; }
    .pop { top: 26px; width: 180px; }
    .time { font-size: 1.35rem; margin: 4px 0; }
    .stats, .laps, .penbadge { display: none; }
    .lbl { display: none; }
    .btns, .btns2 { gap: 4px; margin-top: 4px; }
    .btns button, .btns2 > button, .btns2 .tm > button { padding: 6px 2px; font-size: 1rem; line-height: 1; }
    .tpop { position: fixed; left: 8px; right: 8px; bottom: 8px; width: auto; top: auto; }
    .tpop.flip { left: 8px; right: 8px; }
    .tpop::after { display: none; }
    .card:nth-child(even) .pop { right: 0; }
    .card:nth-child(odd) .pop { right: auto; left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Senora <span>Grand</span></h1>
  <p>Cronómetro de carrera</p>
</header>

<div class="controls">
  <label for="cant">Corredores</label>
  <input type="number" id="cant" min="1" max="20" value="3">
  <button id="aplicar" class="white">Aplicar</button>
  <button id="iniciar" class="primary">Iniciar todos</button>
  <button id="reiniciar">Reiniciar</button>
</div>

<main class="grid" id="grid"></main>

<script>
const $ = id => document.getElementById(id);
const grid = $('grid');
let corredores = [];
let t0 = null;
let corriendo = false;
let raf = null;
let llegada = 0;

function fmt(ms) {
  const m = Math.floor(ms / 60000);
  const s = Math.floor(ms % 60000 / 1000);
  const c = Math.floor(ms % 1000);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(c).padStart(3, '0');
}

// 20 colores distintos: los 12 primeros son los principales del selector
const PALETA = ['#22e06b', '#ff3b3b', '#2f8bff', '#ffd400', '#ff8a00', '#b44dff',
  '#00e5ff', '#ff4fa3', '#ffffff', '#a6ff00', '#8a5a2b', '#9aa5b1',
  '#00bfa5', '#ff6e6e', '#5c6bff', '#ffe98a', '#ff9e57', '#e0a3ff', '#7ef0ff', '#c9ff7a'];

function iniciarColor(c, el) {
  const cp = el.querySelector('.cp'), sw = el.querySelector('.sw'), hex = el.querySelector('.hex');
  const aplicar = col => {
    c.color = col;
    el.style.setProperty('--c', col);
    hex.value = col.toUpperCase();
    hex.classList.remove('bad');
    sw.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.c === col.toLowerCase()));
  };
  PALETA.slice(0, 12).forEach(col => {
    const b = document.createElement('button');
    b.dataset.c = col; b.style.background = col; b.title = col.toUpperCase();
    b.onclick = () => aplicar(col);
    sw.appendChild(b);
  });
  el.querySelector('.cur').onclick = e => {
    e.stopPropagation();
    document.querySelectorAll('.cp.open').forEach(x => { if (x !== cp) { x.classList.remove('open'); x.closest('.card').classList.remove('open'); } });
    cp.classList.toggle('open');
    el.classList.toggle('open', cp.classList.contains('open'));
  };
  cp.querySelector('.pop').onclick = e => e.stopPropagation();
  el.querySelector('.pen').onclick = () => { cp.classList.toggle('edit'); hex.focus(); };
  hex.oninput = () => {
    let v = hex.value.trim();
    if (v && v[0] !== '#') v = '#' + v;
    if (/^#([0-9a-f]{6}|[0-9a-f]{3})$/i.test(v)) {
      if (v.length === 4) v = '#' + [...v.slice(1)].map(x => x + x).join('');
      aplicar(v.toLowerCase());
    } else hex.classList.add('bad');
  };
  aplicar(c.color);
}
document.addEventListener('click', () => document.querySelectorAll('.cp.open').forEach(x => { x.classList.remove('open'); x.closest('.card').classList.remove('open'); }));

function crear() {
  const n = Math.max(1, Math.min(20, parseInt($('cant').value) || 1));
  $('cant').value = n;
  const nombres = corredores.map(c => c.nombre);
  const colores = corredores.map(c => c.color);
  corredores = [];
  grid.innerHTML = '';
  llegada = 0;
  for (let i = 0; i < n; i++) {
    const c = { nombre: nombres[i] || 'Corredor ' + (i + 1), color: colores[i] || PALETA[i % PALETA.length], vueltas: [], pen: 0, marca: 0, final: null, terminado: false };
    corredores.push(c);
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="top"><span class="num">${i + 1}</span>
        <input class="name" value="${c.nombre.replace(/"/g, '&quot;')}" maxlength="24">
        <div class="cp">
          <button class="cur" title="Color del corredor"></button>
          <div class="pop">
            <div class="sw"></div>
            <div class="hexrow"><button class="pen" title="Código hex">✏️</button><input class="hex" maxlength="7" placeholder="#22E06B"></div>
          </div>
        </div>
        <span class="pos"></span></div>
      <div class="time">00:00.000</div>
      <div class="penbadge"></div>
      <div class="stats">
        <span>Última vuelta: <b class="nv">0</b></span>
        <span>Tiempo: <b class="ul">--</b></span>
      </div>
      <div class="btns">
        <button class="vuelta" title="Vuelta" disabled>⏱ <span class="lbl">Vuelta</span></button>
        <button class="white terminar" title="Terminar" disabled>🏁 <span class="lbl">Terminar</span></button>
      </div>
      <div class="btns2">
        <div class="tm">
          <button class="white vertodo" title="Ver tiempos">📋 <span class="lbl">Ver tiempos</span></button>
          <div class="tpop"><div class="tphead"><h4>Todos los tiempos</h4><button class="cerrar" title="Cerrar">✕</button></div><ol class="all"></ol></div>
        </div>
        <button class="white penal" title="+10s penalización" disabled>⚠ <span class="lbl">+10s penalización</span></button>
      </div>
      <ul class="laps"></ul>`;
    c.el = el;
    iniciarColor(c, el);
    el.querySelector('.name').oninput = e => c.nombre = e.target.value;
    el.querySelector('.vuelta').onclick = () => vuelta(c);
    el.querySelector('.terminar').onclick = () => terminar(c);
    el.querySelector('.penal').onclick = () => penalizar(c);
    const tm = el.querySelector('.tm');
    const cerrarT = () => { tm.classList.remove('open'); el.classList.remove('open'); };
    el.querySelector('.vertodo').onclick = () => {
      if (tm.classList.contains('open')) return cerrarT();
      const p = el.querySelector('.tpop');
      tm.classList.add('open'); el.classList.add('open');
      p.classList.remove('flip');
      if (p.getBoundingClientRect().right > innerWidth - 8) p.classList.add('flip');
    };
    el.querySelector('.cerrar').onclick = cerrarT;
    grid.appendChild(el);
    pintarTiempos(c);
  }
  actualizarBotones();
}

function actualizarBotones() {
  $('aplicar').disabled = corriendo;
  $('cant').disabled = corriendo;
  $('iniciar').disabled = corriendo || corredores.every(c => c.terminado) && corredores.length > 0 && t0 !== null;
  $('iniciar').disabled = corriendo || t0 !== null;
  corredores.forEach(c => {
    c.el.querySelector('.vuelta').disabled = !corriendo || c.terminado;
    c.el.querySelector('.terminar').disabled = !corriendo || c.terminado;
    c.el.querySelector('.penal').disabled = t0 === null;
  });
}

function pintarTiempos(c) {
  const ol = c.el.querySelector('.all');
  let h = c.vueltas.map((v, i) => `<li class="${i === c.vueltas.length - 1 ? 'best' : ''}"><span>Vuelta ${i + 1}</span><span>${fmt(v)}</span></li>`).reverse().join('');
  if (!c.vueltas.length) h = '<li><span>Sin vueltas aún</span></li>';
  if (c.pen) h += `<li class="pen"><span>Penalización</span><span>+${fmt(c.pen)}</span></li>`;
  if (c.terminado) h += `<li class="tot"><span>Total</span><span>${fmt(c.final + c.pen)}</span></li>`;
  ol.innerHTML = h;
  c.el.querySelector('.penbadge').textContent = c.pen ? `Penalización: +${c.pen / 1000}s` : '';
}

function posiciones() {
  corredores.filter(c => c.terminado).sort((a, b) => (a.final + a.pen) - (b.final + b.pen))
    .forEach((c, i) => c.el.querySelector('.pos').textContent = 'P' + (i + 1));
}

function penalizar(c) {
  if (t0 === null) return;
  c.pen += 10000;
  if (c.terminado) { c.el.querySelector('.time').textContent = fmt(c.final + c.pen); posiciones(); }
  else c.el.querySelector('.time').textContent = fmt(performance.now() - t0 + c.pen);
  pintarTiempos(c);
}

function pintarVueltas(c) {
  c.el.querySelector('.nv').textContent = c.vueltas.length;
  c.el.querySelector('.ul').textContent = fmt(c.vueltas[c.vueltas.length - 1]);
  const ul = c.el.querySelector('.laps');
  ul.innerHTML = '';
  c.vueltas.map((v, i) => ({ v, i })).slice(-2).reverse().forEach(({ v, i }) => {
    const li = document.createElement('li');
    if (i === c.vueltas.length - 1) li.className = 'best';
    li.innerHTML = `<span>Vuelta ${i + 1}</span><span>${fmt(v)}</span>`;
    ul.appendChild(li);
  });
  pintarTiempos(c);
}

function vuelta(c) {
  if (!corriendo || c.terminado) return;
  const now = performance.now() - t0;
  c.vueltas.push(now - c.marca);
  c.marca = now;
  pintarVueltas(c);
}

function terminar(c) {
  if (!corriendo || c.terminado) return;
  const now = performance.now() - t0;
  if (now - c.marca > 0) { c.vueltas.push(now - c.marca); c.marca = now; pintarVueltas(c); }
  c.terminado = true;
  c.final = now;
  c.el.classList.add('done');
  c.el.querySelector('.time').textContent = fmt(now + c.pen);
  pintarTiempos(c);
  posiciones();
  if (corredores.every(x => x.terminado)) {
    corriendo = false;
    cancelAnimationFrame(raf);
  }
  actualizarBotones();
}

function bucle() {
  const now = performance.now() - t0;
  corredores.forEach(c => { if (!c.terminado) c.el.querySelector('.time').textContent = fmt(now + c.pen); });
  if (corriendo) raf = requestAnimationFrame(bucle);
}

$('iniciar').onclick = () => {
  t0 = performance.now();
  corriendo = true;
  actualizarBotones();
  raf = requestAnimationFrame(bucle);
};

$('reiniciar').onclick = () => {
  corriendo = false;
  cancelAnimationFrame(raf);
  t0 = null;
  crear();
};

$('aplicar').onclick = crear;
crear();
</script>
</body>
</html>
